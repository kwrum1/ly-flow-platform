name: ly-flow-platform

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

x-data-healthcheck: &data-healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 10s

x-core-environment: &core-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: lyflow
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  DB_NAME: lyflow
  REDIS_ADDR: redis:6379
  REDIS_ACL_USERNAME: ${REDIS_ACL_USERNAME:?REDIS_ACL_USERNAME must be set}
  REDIS_ACL_PASSWORD: ${REDIS_ACL_PASSWORD:?REDIS_ACL_PASSWORD must be set}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

services:
  postgres:
    <<: *service-defaults
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: lyflow
      POSTGRES_USER: lyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/sql/asset_tables.sql:/docker-entrypoint-initdb.d/02-asset-tables.sql:ro
    ports:
      - 127.0.0.1:${POSTGRES_BIND_PORT:-5432}:5432
    healthcheck:
      <<: *data-healthcheck
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U lyflow -d lyflow]
    networks: [core]

  redis:
    <<: *service-defaults
    image: ${REDIS_IMAGE:-redis:7-alpine}
    environment:
      REDIS_ACL_USERNAME: ${REDIS_ACL_USERNAME:?REDIS_ACL_USERNAME must be set}
      REDIS_ACL_PASSWORD: ${REDIS_ACL_PASSWORD:?REDIS_ACL_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --maxmemory "${REDIS_MAXMEMORY:-8gb}"
        --maxmemory-policy "${REDIS_MAXMEMORY_POLICY:-noeviction}"
        --requirepass "$$REDIS_PASSWORD"
        --user "$$REDIS_ACL_USERNAME" on ">$$REDIS_ACL_PASSWORD" "~*" "&*" "+@all"
    volumes:
      - redis_data:/data
    ports:
      - 127.0.0.1:${REDIS_BIND_PORT:-6379}:6379
    healthcheck:
      <<: *data-healthcheck
      test: [CMD-SHELL, 'reply=$$(redis-cli --no-auth-warning --user "$$REDIS_ACL_USERNAME" --pass "$$REDIS_ACL_PASSWORD" ping 2>/dev/null) && [ "$$reply" = PONG ]']
    networks: [core]

  clickhouse:
    <<: *service-defaults
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8-alpine}
    environment:
      CLICKHOUSE_DB: lyflow
      CLICKHOUSE_USER: lyflow
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - 127.0.0.1:${CLICKHOUSE_HTTP_BIND_PORT:-8123}:8123
      - 127.0.0.1:${CLICKHOUSE_NATIVE_BIND_PORT:-9000}:9000
    healthcheck:
      <<: *data-healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8123/ping]
    networks: [core]

  ly-server:
    <<: *service-defaults
    image: ${LY_SERVER_IMAGE:-ly-flow/server:productfix-20260731}
    command: [/app/ly-server]
    environment:
      <<: *core-environment
      DB_SSLMODE: disable
      DB_MAX_CONNS: "10"
      DB_MIN_CONNS: "2"
      DB_MAX_CONN_LIFETIME_MINUTES: "30"
      DB_MAX_CONN_IDLE_MINUTES: "5"
      DB_HEALTH_CHECK_SECONDS: "30"
      CLICKHOUSE_ADDR: http://clickhouse:8123
      CLICKHOUSE_DB: lyflow
      CLICKHOUSE_USER: lyflow
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?CLICKHOUSE_PASSWORD must be set}
      SERVER_PORT: "8080"
      MANAGEMENT_INTERFACE: ${MANAGEMENT_INTERFACE:-ens33}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-password}
      LYFLOW_RESET_ADMIN_PASSWORD: ${LYFLOW_RESET_ADMIN_PASSWORD:-false}
      LYFLOW_FORCE_FIRST_LOGIN_PASSWORD_CHANGE: ${LYFLOW_FORCE_FIRST_LOGIN_PASSWORD_CHANGE:-true}
      AGENT_SELF_ENROLL: ${AGENT_SELF_ENROLL:-false}
      INCIDENT_LIFECYCLE_LEGACY_MODE: "true"
      XDR_RULES_DIR: /etc/ly/rules/xdr
      SECURITY_ENGINE_RELOAD_URL: http://ly-security-engine:8080/reload
      SECURITY_ENGINE_CONTROL_TOKEN: ${SECURITY_ENGINE_CONTROL_TOKEN:?SECURITY_ENGINE_CONTROL_TOKEN must be set}
      RULE_SOURCE_TIMEOUT_SECONDS: ${RULE_SOURCE_TIMEOUT_SECONDS:-60}
      RULE_SOURCE_MAX_MIB: ${RULE_SOURCE_MAX_MIB:-64}
      RULE_SOURCE_MAX_REDIRECTS: ${RULE_SOURCE_MAX_REDIRECTS:-4}
      RULE_LIFECYCLE_DIR: /app/rules/security-engine/lifecycle
      ENGINE_RULE_ROOT: /app/rules
      POLICY_TRUST_DIR: /var/lib/lyflow/policy/trust
      POLICY_KEY_DIR: /var/lib/lyflow/policy/keys
      RASP_POLICY_OWNER: ${RASP_POLICY_OWNER:-lyflow-platform}
    ports:
      - 127.0.0.1:${SERVER_BIND_PORT:-8080}:8080
    volumes:
      - server_data:/data
      - ./rules:/etc/ly/rules:ro
      - ./rules:/app/rules
      - rule_lifecycle:/app/rules/security-engine/lifecycle
      - ./.sisyphus:/app/.sisyphus
      - /sys:/host/sys:ro
      - /proc:/host/proc:ro
      - policy_trust:/var/lib/lyflow/policy
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/health]
    networks: [core]

  ly-security-engine:
    <<: *service-defaults
    image: ${LY_SECURITY_ENGINE_IMAGE:-ly-flow/security-engine:healthstream2-20260731}
    command: [/app/ly-security-engine]
    environment:
      REDIS_ADDR: redis:6379
      REDIS_ACL_USERNAME: ${REDIS_ACL_USERNAME:?REDIS_ACL_USERNAME must be set}
      REDIS_ACL_PASSWORD: ${REDIS_ACL_PASSWORD:?REDIS_ACL_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SECURITY_ENGINE_GROUP: security-engine-workers
      SECURITY_ENGINE_NAME: security-engine-1
      SECURITY_ENGINE_INPUT_STREAMS: telemetry:traffic,telemetry:runtime,telemetry:rasp,telemetry:log_audit
      SECURITY_ENGINE_CONTROL_HEALTH_STREAM: control:health
      ALERTS_DPI_STREAM: alerts:dpi
      ALERTS_RUNTIME_STREAM: alerts:runtime
      ALERTS_RASP_STREAM: alerts:rasp
      ALERTS_LOG_AUDIT_STREAM: alerts:log_audit
      SECURITY_ENGINE_LIFECYCLE_MANIFEST: /app/rules/security-engine/lifecycle/active-manifest.json
      SECURITY_ENGINE_RULE_TRUST_ROOT: /var/lib/lyflow/policy/trust/rule-root.pem
      SECURITY_ENGINE_BUNDLE_ROOT: /app/rules
      SECURITY_ENGINE_CONTROL_TOKEN: ${SECURITY_ENGINE_CONTROL_TOKEN:?SECURITY_ENGINE_CONTROL_TOKEN must be set}
      SECURITY_ENGINE_RELOAD_AUDIT_PATH: /var/lib/lyflow/audit/reload.jsonl
    volumes:
      - security_engine_data:/data
      - ./rules:/app/rules:ro
      - rule_lifecycle:/app/rules/security-engine/lifecycle:ro
      - policy_trust:/var/lib/lyflow/policy:ro
      - security_engine_audit:/var/lib/lyflow/audit
    depends_on:
      redis: { condition: service_healthy }
      ly-server: { condition: service_healthy }
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
    networks: [core]

  agent-center:
    <<: *service-defaults
    image: ${LY_SERVER_IMAGE:-ly-flow/server:productfix-20260731}
    command: [/app/ly-agent-center]
    environment:
      <<: *core-environment
      GRPC_PORT: "8081"
    ports:
      - ${AGENT_CENTER_BIND_PORT:-8081}:8081
    volumes:
      - agent_center_data:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      test: [CMD, /app/ly-agent-center, healthcheck]
    networks: [core]

  ly-vis:
    <<: *service-defaults
    image: ${LY_FRONTEND_IMAGE:-ly-flow/frontend:productfix-20260731}
    environment:
      LY_SERVER_UPSTREAM: http://ly-server:8080
    ports:
      - ${HTTPS_BIND_PORT:-443}:443
      - ${HTTP_BIND_PORT:-80}:80
    depends_on:
      ly-server: { condition: service_healthy }
    healthcheck:
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, https://127.0.0.1/]
    networks: [core]

  ly-local-mirror:
    <<: *service-defaults
    image: ${LY_LOCAL_MIRROR_IMAGE:-ly-flow/local-mirror:signed4}
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN]
    environment:
      AGENT_MODE: local-mirror
      LOCAL_MIRROR_MODE: "true"
      MIRROR_CONFIG_FILE: /app/.sisyphus/runtime/mirror-capture-config.json
      API_SERVER: http://127.0.0.1:${SERVER_BIND_PORT:-8080}
      REDIS_SERVER: 127.0.0.1:${REDIS_BIND_PORT:-6379}
      REDIS_ACL_USERNAME: ${REDIS_ACL_USERNAME:?REDIS_ACL_USERNAME must be set}
      REDIS_ACL_PASSWORD: ${REDIS_ACL_PASSWORD:?REDIS_ACL_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      TRAFFIC_ENABLED: "true"
      TRAFFIC_INTERFACE: ${LOCAL_MIRROR_INTERFACE:-}
      CAPTURE_ENGINE: ${LOCAL_MIRROR_CAPTURE_ENGINE:-pfring}
      PROMISCUOUS: "true"
      TRAFFIC_MAX_EVENTS_PER_SECOND: ${LOCAL_MIRROR_MAX_EVENTS_PER_SECOND:-0}
      HIDS_ENABLED: "false"
      RASP_ENABLED: "false"
      ASSET_ENABLED: "false"
      SESSION_STREAM: sessions:semantic
      RAW_STREAM: flows:raw
      SEMANTIC_STREAM: flows:semantic
      TELEMETRY_TRAFFIC_STREAM: telemetry:traffic
      RETENTION_ENABLED: "false"
      SPOOL_ENABLED: "true"
      SPOOL_DIR: /opt/ly-agent/data/spool
      SPOOL_MAX_BYTES: ${LOCAL_MIRROR_SPOOL_MAX_BYTES:-10737418240}
      LOG_FILE: /opt/ly-agent/logs/local-mirror.log
    volumes:
      - local_mirror_data:/data
      - agent_spool:/opt/ly-agent/data
      - policy_trust:/var/lib/lyflow/policy:ro
      - ./.sisyphus:/app/.sisyphus:ro
    depends_on:
      ly-server: { condition: service_started }
      redis: { condition: service_healthy }
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
      test: [CMD, /app/ly-agent, healthcheck, local-mirror]

  ly-suricata-sensor:
    <<: *service-defaults
    image: "${LY_SURICATA_IMAGE:-ly-flow/suricata-profile:release-rc-652a7b620dfd-todo5-20260730T071221Z-amd64}"
    network_mode: host
    cap_add: [NET_RAW, NET_ADMIN, SYS_NICE]
    command: ["-c", "/etc/suricata/lyflow-suricata-profile.yaml", "-i", "${SURICATA_INTERFACE:-ens35}"]
    volumes:
      - ./.sisyphus/runtime/engine-outputs/suricata-profile:/var/log/suricata
    healthcheck:
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
      test: [CMD-SHELL, "pgrep -x Suricata-Main >/dev/null"]

networks:
  core:
    name: ly-flow-platform-core

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  server_data:
  policy_trust:
  rule_lifecycle:
  security_engine_data:
  security_engine_audit:
  agent_center_data:
  local_mirror_data:
  agent_spool:
