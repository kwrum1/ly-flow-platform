# 流影安全态势感知平台 - Docker Compose
# 版本: v2.0.1
# 更新日期: 2026-05-08

version: '3.8'

services:
  # =====================================================
  # PostgreSQL 数据库
  # =====================================================
  postgres:
    image: postgres:16-alpine
    container_name: ly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lyflow
      POSTGRES_USER: lyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lyflow_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./server/sql/asset_tables.sql:/docker-entrypoint-initdb.d/02-asset-tables.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyflow -d lyflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ly-network

  # =====================================================
  # Redis 数据库
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: ly-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ly-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: ly-clickhouse
    restart: unless-stopped
    environment:
      - CLICKHOUSE_DB=lyflow
      - CLICKHOUSE_USER=lyflow
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-lyflow_clickhouse_password}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ly-network

  # =====================================================
  # ly-server (后端API)
  # =====================================================
  ly-server:
    image: ly-flow/server:latest
    build:
      context: .
      dockerfile: server/Dockerfile.final
    container_name: ly-server
    restart: unless-stopped
    command: ["/app/ly-server"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=lyflow
      - DB_PASSWORD=${POSTGRES_PASSWORD:-lyflow_secret_password}
      - DB_NAME=lyflow
      - DB_SSLMODE=disable
      - DB_MAX_CONNS=10
      - DB_MIN_CONNS=2
      - DB_MAX_CONN_LIFETIME_MINUTES=30
      - DB_MAX_CONN_IDLE_MINUTES=5
      - DB_HEALTH_CHECK_SECONDS=30
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - CLICKHOUSE_ADDR=http://clickhouse:8123
      - CLICKHOUSE_DB=lyflow
      - CLICKHOUSE_USER=lyflow
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-lyflow_clickhouse_password}
      - SERVER_PORT=8080
      - JWT_SECRET=${JWT_SECRET:-change_this_in_production}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-password}
      - LYFLOW_RESET_ADMIN_PASSWORD=${LYFLOW_RESET_ADMIN_PASSWORD:-true}
      - LYFLOW_FORCE_FIRST_LOGIN_PASSWORD_CHANGE=${LYFLOW_FORCE_FIRST_LOGIN_PASSWORD_CHANGE:-true}
      - AGENT_SELF_ENROLL=${AGENT_SELF_ENROLL:-true}
      - XDR_RULES_DIR=/etc/ly/rules/xdr
      - SECURITY_ENGINE_RELOAD_URL=http://ly-security-engine:8080/reload
      - ENGINE_RULE_ROOT=/app/rules
      - ENGINE_STATUS_FILE=/app/.sisyphus/runtime/engine-outputs/status/status.json
      - RASP_BLOCK_BY_DEFAULT=true
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ./rules:/etc/ly/rules:ro
      - ./rules:/app/rules
      - ./.sisyphus:/app/.sisyphus
      - /sys:/host/sys:ro
    networks:
      - ly-network

  # =====================================================
  # ly-dpi-engine (legacy fallback only; ly-security-engine is default DPI executor)
  # =====================================================
  ly-dpi-engine:
    profiles: ["legacy-dpi"]
    image: ly-flow/dpi-engine:latest
    build:
      context: .
      dockerfile: dpi-engine/Dockerfile
    container_name: ly-dpi-engine
    restart: unless-stopped
    command: ["/app/ly-dpi-engine"]
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_STREAM_IN=flows:raw
      - REDIS_STREAM_OUT=alerts:dpi
      - CONSUMER_GROUP=dpi-workers
      - CONSUMER_NAME=dpi-engine
      - WORKERS=4
      - DOMAIN_MINING=/etc/ly/rules/domain/mining.txt
      - DOMAIN_FRAUD=/etc/ly/rules/domain/fraud.txt
      - DOMAIN_CUSTOM=/etc/ly/rules/domain/custom.txt
      - RULES_FILE=/etc/ly/rules/suricata/et-open.rules
      - DATABASE_RULES_PATH=/etc/ly/dpi-rules/database
    volumes:
      - ./rules:/etc/ly/rules:ro
      - ./dpi-engine/rules:/etc/ly/dpi-rules:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ly-network

  # =====================================================
  # ly-security-engine (统一检测引擎，DPI/Runtime/RASP/日志审计)
  # =====================================================
  ly-security-engine:
    image: ly-flow/security-engine:latest
    build:
      context: .
      dockerfile: security-engine/Dockerfile
    container_name: ly-security-engine
    restart: unless-stopped
    command: ["/app/ly-security-engine"]
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - SECURITY_ENGINE_GROUP=security-engine-workers
      - SECURITY_ENGINE_NAME=security-engine-1
      - SECURITY_ENGINE_INPUT_STREAMS=telemetry:traffic,telemetry:runtime,telemetry:rasp,telemetry:log_audit
      - ALERTS_DPI_STREAM=alerts:dpi
      - ALERTS_RUNTIME_STREAM=alerts:runtime
      - ALERTS_RASP_STREAM=alerts:rasp
      - ALERTS_LOG_AUDIT_STREAM=alerts:log_audit
      - SECURITY_ENGINE_BUNDLE=/app/rules/security-engine/active-bundle.json
      - RASP_BLOCK_BY_DEFAULT=false
    volumes:
      - ./rules:/app/rules:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ly-network

  # =====================================================
  # ly-vis (Vue3 前端)
  # =====================================================
  ly-vis:
    image: ly-flow/frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ly-vis
    restart: unless-stopped
    environment:
      - LY_SERVER_UPSTREAM=${LY_SERVER_UPSTREAM:-http://ly-server:8080}
    ports:
      - "443:443"
    depends_on:
      ly-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ly-network

  # =====================================================
  # ly-engine-lab (GitHub source/rule packaged external engines)
  # =====================================================
  ly-engine-lab:
    image: ly-flow/security-engines:latest
    build:
      context: .
      dockerfile: containers/security-engines/Dockerfile
    container_name: ly-engine-lab
    restart: unless-stopped
    environment:
      - ENGINE_LAB_INTERVAL=${ENGINE_LAB_INTERVAL:-45}
      - ENGINE_LAB_EMIT_SAMPLE_EVENTS=${ENGINE_LAB_EMIT_SAMPLE_EVENTS:-false}
      - SURICATA_EVE=/var/log/suricata/eve.json
      - WAZUH_ALERTS=/var/ossec/logs/alerts/alerts.json
      - YARA_RESULTS=/opt/ly-agent/yara/last-scan.json
      - RASP_EVENTS=/opt/ly-agent/rasp/events.jsonl
      - ENGINE_RULE_ROOT=/opt/ly-engine-lab/rules
      - ENGINE_STATUS_FILE=/opt/ly-engine-lab/runtime/status.json
    volumes:
      - ./.sisyphus/runtime/engine-outputs/suricata:/var/log/suricata
      - ./.sisyphus/runtime/engine-outputs/wazuh:/var/ossec/logs/alerts
      - ./.sisyphus/runtime/engine-outputs/yara:/opt/ly-agent/yara
      - ./.sisyphus/runtime/engine-outputs/rasp:/opt/ly-agent/rasp
      - ./.sisyphus/runtime/engine-outputs/status:/opt/ly-engine-lab/runtime
      - ./rules:/opt/ly-engine-lab/rules:ro
    networks:
      - ly-network

  # =====================================================
  # AgentCenter (Agent管理服务，gRPC)
  # =====================================================
  agent-center:
    image: ly-flow/server:latest
    build:
      context: .
      dockerfile: server/Dockerfile.final
    container_name: agent-center
    restart: unless-stopped
    command: ["/app/ly-agent-center"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=lyflow
      - DB_PASSWORD=${POSTGRES_PASSWORD:-lyflow_secret_password}
      - DB_NAME=lyflow
      - REDIS_ADDR=redis:6379
      - GRPC_PORT=8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ly-network

  # =====================================================
  # ly-local-mirror (security-server passive mirror capture)
  # =====================================================
  ly-local-mirror:
    image: ly-flow/agent:latest
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: ly-local-mirror
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - AGENT_MODE=local-mirror
      - LOCAL_MIRROR_MODE=true
      - API_SERVER=http://127.0.0.1:8080
      - REDIS_SERVER=127.0.0.1:6379
      - TRAFFIC_ENABLED=true
      - TRAFFIC_INTERFACE=${LOCAL_MIRROR_INTERFACE:-auto}
      - CAPTURE_ENGINE=af_packet
      - BPF_FILTER=${LOCAL_MIRROR_BPF_FILTER:-(tcp or udp) and not net 172.16.0.0/12}
      - PROMISCUOUS=true
      - TRAFFIC_MAX_EVENTS_PER_SECOND=${LOCAL_MIRROR_MAX_EVENTS_PER_SECOND:-0}
      - HIDS_ENABLED=false
      - RASP_ENABLED=false
      - ASSET_ENABLED=false
      - SESSION_STREAM=sessions:semantic
      - RAW_STREAM=flows:raw
      - SEMANTIC_STREAM=flows:semantic
      - TELEMETRY_TRAFFIC_STREAM=telemetry:traffic
      - RETENTION_ENABLED=false
      - LOG_FILE=/opt/ly-agent/logs/local-mirror.log
    depends_on:
      ly-server:
        condition: service_started
      redis:
        condition: service_healthy

  # =====================================================
  # ly-agent (containerized universal agent for local full-system QA)
  # =====================================================
  ly-agent:
    profiles:
      - container-agent
    image: ly-flow/agent:latest
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: ly-agent
    restart: unless-stopped
    environment:
      - API_SERVER=http://ly-server:8080
      - REDIS_SERVER=redis:6379
      - AGENT_ID=ly-container-agent
      - AGENT_KEY=ly-container-agent-key
      - TRAFFIC_ENABLED=false
      - HIDS_ENABLED=true
      - RASP_ENABLED=true
      - ASSET_ENABLED=true
      - ENGINE_STATUS_FILE=/opt/ly-engine-lab/runtime/status.json
      - LOG_FILE=/opt/ly-agent/logs/agent.log
    volumes:
      - ./.sisyphus/runtime/engine-outputs/suricata:/var/log/suricata
      - ./.sisyphus/runtime/engine-outputs/wazuh:/var/ossec/logs/alerts
      - ./.sisyphus/runtime/engine-outputs/yara:/opt/ly-agent/yara
      - ./.sisyphus/runtime/engine-outputs/rasp:/opt/ly-agent/rasp
      - ./.sisyphus/runtime/engine-outputs/status:/opt/ly-engine-lab/runtime:ro
    depends_on:
      ly-server:
        condition: service_started
      redis:
        condition: service_healthy
      ly-engine-lab:
        condition: service_started
    networks:
      - ly-network

# =====================================================
# 网络配置
# =====================================================
networks:
  ly-network:
    name: ly-network
    driver: bridge

# =====================================================
# 存储卷
# =====================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
