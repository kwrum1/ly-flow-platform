%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "any"
    EXTERNAL_NET: "any"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: "1521"
    SSH_PORTS: "22"

default-log-dir: /var/log/suricata
default-rule-path: /var/lib/suricata/rules
rule-files:
  - lyflow-suricata.rules
  - server-zone/suricata.rules
  - et-open/et-open.rules

stream:
  checksum-validation: yes

af-packet:
  - interface: ens35
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
    tpacket-v3: yes

app-layer:
  protocols:
    dns:
      enabled: yes
    http:
      enabled: yes
    tls:
      enabled: yes
    ssh:
      enabled: no
    smb:
      enabled: no
    krb5:
      enabled: no

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      threaded: false
      community-id: true
      community-id-seed: 0
      metadata: yes
      pcap-file: false
      types:
        - flow
        - alert:
            metadata: yes
            tagged-packets: no
        - dns:
            version: 2
            enabled: yes
            requests: yes
            responses: yes
        - http:
            extended: yes
        - tls:
            extended: yes
            session-resumption: yes
        - stats:
            totals: yes
            threads: no

stats:
  interval: 60
