    negative:
      - message: "GET /health HTTP/1.1"
    boundary:
      - text: "GET /etc/passwd HTTP/1.1"
        want: true
        note: "sensitive path"
      - text: "GET /etc/passwd.bak HTTP/1.1"
        want: true
        note: "prefix match is intentional"

  - rule_id: 81008
    positive:
      - message: "chain_id=abc123 stage=execution host=web-01"
    negative:
      - message: "chain_id=abc123 stage=recon host=web-01"
    boundary:
