[project]
name = "ly-rasp-python"
version = "1.0.0"
description = "Monitor-only Python RASP candidate"
requires-python = ">=3.10,<3.13"
dependencies = [
    "redis==5.0.0",
]

[build-system]
requires = ["setuptools==78.1.1"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest==7.0.0",
    "pytest-asyncio==0.21.0",
]
