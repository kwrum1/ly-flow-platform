[project]
name = "ly-rasp-python"
version = "1.0.0"
description = "Python RASP (Runtime Application Self-Protection) agent"
requires-python = ">=3.8"
dependencies = [
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]