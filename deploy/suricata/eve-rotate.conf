# LyFlow Suricata EVE retention configuration.
#
# ############################################################################
# This is NOT a logrotate(8) config. Do not copy it into /etc/logrotate.d/.
# It is a KEY=VALUE policy file for deploy/suricata/eve-retention.sh, installed
# at /etc/lyflow/eve-rotate.conf. Keeping logrotate in the loop is what produced
# the 49-file / 2.1 GB directory: `hourly` + `rotate 48` has no total-size bound.
# ############################################################################
#
# Read by deploy/suricata/eve-retention.sh (installed as
# /opt/ly-flow-platform/scripts/eve-retention.sh).
#
# Why logrotate could not express this policy:
#   * no cap on the total size of the directory (logrotate only counts files);
#   * no runtime overrides from the environment (logrotate does not expand env);
#   * no disk-usage alerts through syslog.
#
# Precedence: the environment (systemd Environment=, drop-ins, or the calling
# shell) wins over this file. Keys use the same names as the environment
# variables, and unknown keys are ignored rather than executed.

# Directory holding eve.json, mounted into the sensor as /var/log/suricata.
EVE_DIR=/opt/ly-flow-platform/.sisyphus/runtime/engine-outputs/suricata-profile

# Name of the file Suricata keeps open.
EVE_ACTIVE_FILE=eve.json

# Per-file cap. Reaching it rotates the active file (copytruncate).
# Accepts bytes or a K/M/G/T suffix. 200M on this sensor is roughly 45 minutes
# of traffic at the observed 2026-11-10 rate (~280 MB/h peak).
EVE_MAX_FILE_BYTES=200M

# Total cap for eve.json + every rotated file. Oldest rotated files are deleted
# first; the active file is never deleted. 2G is a hard backstop for the 991 GB
# root volume that previously reached 91% usage.
EVE_MAX_TOTAL_BYTES=2G

# Delete rotated files older than this many days (in addition to the size cap).
# Note which bound actually binds: at the observed 2026-11-10 rate the sensor
# writes ~1 GB/day of compressed EVE, so EVE_MAX_TOTAL_BYTES=2G fills up before
# 3 days elapse and the size cap wins. Raise the total cap if you need the full
# 3-day window at the current rate.
EVE_RETENTION_DAYS=3

# gzip rotated files (1 = on).
EVE_COMPRESS=1

# gzip level. Measured on a 200 MB slice of this sensor's real EVE data
# (2026-11-10, 8 vCPU, load ~12):
#   -1  4.4s -> 32.4 MB    -6  7.0s -> 25.9 MB    -9  10.2s -> 24.9 MB
# -9 costs 45% more CPU for 4% less space. The host is already CPU-bound, so the
# default is 6; raise to 9 only if you need the last few percent of disk.
EVE_GZIP_LEVEL=6

# Filesystem watermark alerts, emitted through logger(1) to syslog, tag
# lyflow-eve-retention, facility user, priorities warning/err.
EVE_DISK_WARN_PCT=80
EVE_DISK_CRIT_PCT=90

# Repeat an unchanged watermark level at most this often (seconds). Level
# transitions always alert immediately, and a return to ok emits RECOVERED.
EVE_ALERT_REPEAT_SECONDS=3600

# Send alerts to syslog (0 = stderr only, used by the QA test).
EVE_SYSLOG=1
