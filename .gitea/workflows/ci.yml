name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The runner fetches actions from github.com, which this network blocks.
      # The project repo is public on this Gitea instance, so clone it directly.
      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "http://10.1.18.100:10000/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Environment
        run: |
          set -euo pipefail
          pwd
          git rev-parse --short HEAD
          go version
          node --version
          python3 --version
      - name: Fast checks
        env:
          GOPROXY: https://goproxy.cn,direct
          GOTOOLCHAIN: local
          PYTHONIOENCODING: utf-8
        run: bash scripts/dev/test-all.sh fast
