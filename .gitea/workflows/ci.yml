name: ly-flow-platform-build

on:
  push:
    branches: [main, takeover/**]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Test server
        working-directory: server
        run: GOWORK=off go test ./...

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Test agent
        working-directory: agent
        run: GOWORK=off go test ./cmd

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test and build frontend
        working-directory: frontend
        run: npm ci && npm run test -- --run && npm run build
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: ly-flow-frontend-${{ github.sha }}
          path: frontend/dist

  packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, agent, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts frontend/dist
          cd server
          GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../artifacts/ly-server-linux-amd64 ./cmd
          cd ../agent
          for target in "linux amd64" "linux arm64" "windows amd64"; do
            read -r os arch <<<"$target"
            suffix=""
            [ "$os" = windows ] && suffix=".exe"
            GOWORK=off CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "../artifacts/ly-agent-${os}-${arch}${suffix}" ./cmd
          done
          cd ..
          cp scripts/install.sh scripts/install-offline.sh scripts/test-install.sh artifacts/
          printf 'commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > artifacts/BUILD-MANIFEST.txt
          tar -czf "artifacts/ly-flow-platform-${GITHUB_SHA}.tar.gz" -C artifacts .
      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: ly-flow-platform-${{ github.sha }}
          path: artifacts
