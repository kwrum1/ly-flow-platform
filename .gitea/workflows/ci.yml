name: LyFlow Docker Bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  docker-bundle:
    name: Build Docker deployment bundle
    runs-on: docker
    steps:
      - name: Checkout from Gitea
        run: |
          set -euo pipefail
          if [ ! -d .git ]; then
            d=$(mktemp -d "$PWD/.checkout.XXXXXX")
            git clone --depth 1 "${GITEA_INSTANCE_URL:-http://127.0.0.1:10000}/${GITHUB_REPOSITORY:-ly-flow-platform/ly-flow-platform}.git" "$d/repo"
            cp -a "$d/repo/." .
            rm -rf "$d"
          fi
          test -f docker-compose.yml
      - name: Build Docker bundle
        run: |
          set -euo pipefail
          bash scripts/build-docker-bundle.sh
      - name: Verify bundle
        run: |
          set -euo pipefail
          bundle=$(ls -1 release/lyflow-docker-bundle-*.tar.gz | tail -n 1)
          tar -tzf "$bundle" | grep -E 'docker-compose.yml|images/lyflow-images.tar.gz|scripts/install-docker-bundle.sh'
          sha256sum --check "$bundle.sha256"
      - name: Upload Docker bundle
        if: github.event_name != 'pull_request'
        env:
          LYFLOW_GITEA_TOKEN: ${{ secrets.LYFLOW_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          bundle=$(ls -1 release/lyflow-docker-bundle-*.tar.gz | tail -n 1)
          tag="docker-bundle-${GITHUB_SHA:-main}-${GITHUB_RUN_ID:-local}"
          api="${GITEA_SERVER_URL:-http://127.0.0.1:10000}/api/v1/repos/ly-flow-platform/ly-flow-platform"
          token="${LYFLOW_GITEA_TOKEN:-}"
          test -n "$token"
          release=$(curl -fsS -H "Authorization: token $token" "$api/releases/tags/$tag" 2>/dev/null || true)
          if ! printf '%s' "$release" | grep -q '"id"'; then
            release=$(curl -fsS -X POST -H "Authorization: token $token" -H 'Content-Type: application/json' -d "{"tag_name":"$tag","target_commitish":"main","name":"$tag","body":"Docker deployment bundle"}" "$api/releases")
          fi
          id=$(printf '%s' "$release" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST -H "Authorization: token $token" -F "attachment=@$bundle" "$api/releases/$id/assets"
          curl -fsS -X POST -H "Authorization: token $token" -F "attachment=@$bundle.sha256" "$api/releases/$id/assets"
