name: Offline Release Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-amd64:
    name: Build amd64 offline package
    runs-on: docker
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
      GIT_TERMINAL_PROMPT: "0"
      GOTOOLCHAIN: local
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify runner checkout
        run: |
          set -euo pipefail
          test -d .git || { echo "Gitea runner did not provide a repository checkout" >&2; exit 1; }
          test -f scripts/build-offline-release.sh || { echo "runner checkout is incomplete" >&2; exit 1; }

      - name: Check workspace and tools
        run: |
          set -euo pipefail
          test -f scripts/build-offline-release.sh
          command -v go
          command -v node
          command -v npm
          docker version
          docker compose version
          go version
          node --version
          npm --version
          python3 --version
          test "$(go env GOVERSION)" = go1.26.5
          test "$(node --version)" = v22.22.2

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          npm --prefix frontend ci --offline

      - name: Run targeted tests
        run: |
          set -euo pipefail
          (cd agent && GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOWORK=off go test ./cmd)
          (cd server && GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOWORK=off go test ./cmd)

      - name: Run delivery QA and current-source smoke
        run: |
          set -euo pipefail
          bash scripts/qa/install-offline_test.sh
          bash scripts/qa/container-smoke_test.sh
          bash scripts/qa/gitea-workflow_test.sh
          LYFLOW_SMOKE_TIMEOUT_SECONDS=180 bash scripts/container-smoke.sh

      - name: Build amd64 release package
        run: |
          set -euo pipefail
          ci_tmp=$(mktemp -d "$PWD/.lyflow-amd64.XXXXXX")
          printf '%s\n' "$ci_tmp" >.lyflow-amd64-tmp
          openssl genpkey -algorithm ED25519 -out "$ci_tmp/release.key"
          openssl pkey -in "$ci_tmp/release.key" -pubout -out "$ci_tmp/release-root.pem"
          nginx=$(docker image inspect nginx:1.27-alpine --format '{{index .RepoDigests 0}}')
          suricata=$(docker image inspect jasonish/suricata:7.0.11 --format '{{index .RepoDigests 0}}')
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) \
            RELEASE_ID="${GITHUB_SHA:-$(git rev-parse --short=12 HEAD)}" \
            RELEASE_SIGNING_KEY="$ci_tmp/release.key" \
            NGINX_IMAGE="$nginx" SURICATA_PROFILE_IMAGE="$suricata" \
            LYFLOW_CI_LOCAL_CACHE=1 TARGET_ARCH=amd64 bash scripts/build-offline-release.sh

      - name: Verify amd64 artifact
        run: |
          set -euo pipefail
          ci_tmp=$(<.lyflow-amd64-tmp)
          package=$(ls -1 release/lyflow-offline-install-amd64-*.tar.gz | tail -n 1)
          tar -tzf "$package" | grep -E '(^|/)ARCH$|docker-compose.yml|images/lyflow-images.tar.gz'
          mkdir -p "$ci_tmp/artifact"
          tar -xzf "$package" -C "$ci_tmp/artifact" --strip-components=1
          grep -qx 'amd64' "$ci_tmp/artifact/ARCH"
          ! grep -Eq 'image:[[:space:]]+.*:latest' "$ci_tmp/artifact/docker-compose.yml"
          bash scripts/release-provenance.sh verify --package "$ci_tmp/artifact" --root "$ci_tmp/release-root.pem"

      - name: Upload amd64 package to Gitea release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          LYFLOW_GITEA_TOKEN: ${{ secrets.LYFLOW_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          package=$(ls -1 release/lyflow-offline-install-amd64-*.tar.gz | tail -n 1)
          tag="offline-${GITHUB_SHA:-$(git rev-parse --short HEAD)}-${GITHUB_RUN_ID:-local}"
          api="${GITEA_SERVER_URL:-http://127.0.0.1:10000}/api/v1/repos/ly-flow-platform/ly-flow-platform"
          token="${LYFLOW_GITEA_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "LYFLOW_GITEA_TOKEN is required for release upload" >&2
            exit 1
          fi
          release_json=$(curl -fsS -H "Authorization: token $token" "$api/releases/tags/$tag" 2>/dev/null || true)
          if ! printf '%s' "$release_json" | python3 -c 'import json, sys; data=sys.stdin.read(); sys.exit(0 if data and "id" in json.loads(data) else 1)' 2>/dev/null; then
            payload=$(TAG="$tag" TARGET="${GITHUB_SHA:-main}" python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["TAG"], "target_commitish": os.environ["TARGET"], "name": "Offline packages " + os.environ["TAG"], "body": "Automated amd64 and arm64 offline release packages.", "draft": False, "prerelease": False}))')
            if ! release_json=$(curl -fsS -X POST -H "Authorization: token $token" -H "Content-Type: application/json" \
              -d "$payload" \
              "$api/releases"); then
              release_json=$(curl -fsS -H "Authorization: token $token" "$api/releases/tags/$tag")
            fi
          fi
          release_id=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST -H "Authorization: token $token" -F "attachment=@${package}" "$api/releases/$release_id/assets"

      - name: Clean amd64 temporary files
        if: always()
        run: |
          set -euo pipefail
          if [ -f .lyflow-amd64-tmp ]; then
            ci_tmp=$(<.lyflow-amd64-tmp)
            rm -rf -- "$ci_tmp"
            rm -f .lyflow-amd64-tmp
          fi

  release-arm64:
    name: Build arm64 offline package
    runs-on: [docker, arm64]
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
      GIT_TERMINAL_PROMPT: "0"
      GOTOOLCHAIN: local
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify runner checkout
        run: |
          set -euo pipefail
          test -d .git || { echo "Gitea runner did not provide a repository checkout" >&2; exit 1; }
          test -f scripts/build-offline-release.sh || { echo "runner checkout is incomplete" >&2; exit 1; }

      - name: Verify arm64 cache mode
        run: |
          set -euo pipefail
          docker image inspect ly-flow/server:latest-arm64 >/dev/null
          docker image inspect ly-flow/agent:latest-arm64 >/dev/null

      - name: Check workspace and tools
        run: |
          set -euo pipefail
          test -f scripts/build-offline-release.sh
          command -v go
          command -v node
          command -v npm
          docker version
          docker compose version
          go version
          node --version
          npm --version
          python3 --version
          test "$(go env GOVERSION)" = go1.26.5
          test "$(node --version)" = v22.22.2
          if [ "$(go env GOARCH)" != arm64 ]; then
            echo "arm64 release job requires a native arm64 runner" >&2
            exit 1
          fi
          test "$(go env GOARCH)" = arm64

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          npm --prefix frontend ci --offline

      - name: Run targeted tests
        run: |
          set -euo pipefail
          (cd agent && GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOWORK=off go test ./cmd)
          (cd server && GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOWORK=off go test ./cmd)

      - name: Build arm64 agent binary
        run: |
          set -euo pipefail
          (cd agent && GOPROXY=off GOSUMDB=off GOTOOLCHAIN=local GOWORK=off \
            GOOS=linux GOARCH=arm64 CGO_ENABLED=1 go build -o ly-agent-arm64 ./cmd)
          file agent/ly-agent-arm64 | grep -E 'ARM aarch64|aarch64'

      - name: Build arm64 release package
        run: |
          set -euo pipefail
          ci_tmp=$(mktemp -d "$PWD/.lyflow-arm64.XXXXXX")
          printf '%s\n' "$ci_tmp" >.lyflow-arm64-tmp
          openssl genpkey -algorithm ED25519 -out "$ci_tmp/release.key"
          openssl pkey -in "$ci_tmp/release.key" -pubout -out "$ci_tmp/release-root.pem"
          postgres=$(docker image inspect ly-flow/postgres:16-alpine-arm64 --format '{{index .RepoDigests 0}}')
          redis=$(docker image inspect ly-flow/redis:7-alpine-arm64 --format '{{index .RepoDigests 0}}')
          clickhouse=$(docker image inspect ly-flow/clickhouse:24.8-alpine-arm64 --format '{{index .RepoDigests 0}}')
          nginx=$(docker image inspect nginx:1.27-alpine --format '{{index .RepoDigests 0}}')
          suricata=$(docker image inspect jasonish/suricata:7.0.11 --format '{{index .RepoDigests 0}}')
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) \
            RELEASE_ID="${GITHUB_SHA:-$(git rev-parse --short=12 HEAD)}" \
            RELEASE_SIGNING_KEY="$ci_tmp/release.key" \
            DB_POSTGRES_IMAGE="$postgres" DB_REDIS_IMAGE="$redis" DB_CLICKHOUSE_IMAGE="$clickhouse" \
            NGINX_IMAGE="$nginx" SURICATA_PROFILE_IMAGE="$suricata" \
            LYFLOW_CI_LOCAL_CACHE=1 TARGET_ARCH=arm64 ARM64_AGENT_BINARY="$PWD/agent/ly-agent-arm64" bash scripts/build-offline-release.sh

      - name: Verify arm64 artifact
        run: |
          set -euo pipefail
          ci_tmp=$(<.lyflow-arm64-tmp)
          package=$(ls -1 release/lyflow-offline-install-arm64-*.tar.gz | tail -n 1)
          tar -tzf "$package" | grep -E '(^|/)ARCH$|docker-compose.yml|images/lyflow-images.tar.gz'
          mkdir -p "$ci_tmp/artifact"
          tar -xzf "$package" -C "$ci_tmp/artifact" --strip-components=1
          grep -qx 'arm64' "$ci_tmp/artifact/ARCH"
          ! grep -Eq 'image:[[:space:]]+.*:latest' "$ci_tmp/artifact/docker-compose.yml"
          bash scripts/release-provenance.sh verify --package "$ci_tmp/artifact" --root "$ci_tmp/release-root.pem"

      - name: Upload arm64 package to Gitea release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          LYFLOW_GITEA_TOKEN: ${{ secrets.LYFLOW_GITEA_TOKEN }}
        run: |
          set -euo pipefail
          package=$(ls -1 release/lyflow-offline-install-arm64-*.tar.gz | tail -n 1)
          tag="offline-${GITHUB_SHA:-$(git rev-parse --short HEAD)}-${GITHUB_RUN_ID:-local}"
          api="${GITEA_SERVER_URL:-http://127.0.0.1:10000}/api/v1/repos/ly-flow-platform/ly-flow-platform"
          token="${LYFLOW_GITEA_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "LYFLOW_GITEA_TOKEN is required for release upload" >&2
            exit 1
          fi
          release_json=$(curl -fsS -H "Authorization: token $token" "$api/releases/tags/$tag" 2>/dev/null || true)
          if ! printf '%s' "$release_json" | python3 -c 'import json, sys; data=sys.stdin.read(); sys.exit(0 if data and "id" in json.loads(data) else 1)' 2>/dev/null; then
            payload=$(TAG="$tag" TARGET="${GITHUB_SHA:-main}" python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["TAG"], "target_commitish": os.environ["TARGET"], "name": "Offline packages " + os.environ["TAG"], "body": "Automated amd64 and arm64 offline release packages.", "draft": False, "prerelease": False}))')
            if ! release_json=$(curl -fsS -X POST -H "Authorization: token $token" -H "Content-Type: application/json" \
              -d "$payload" \
              "$api/releases"); then
              release_json=$(curl -fsS -H "Authorization: token $token" "$api/releases/tags/$tag")
            fi
          fi
          release_id=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST -H "Authorization: token $token" -F "attachment=@${package}" "$api/releases/$release_id/assets"

      - name: Clean arm64 temporary files
        if: always()
        run: |
          set -euo pipefail
          if [ -f .lyflow-arm64-tmp ]; then
            ci_tmp=$(<.lyflow-arm64-tmp)
            rm -rf -- "$ci_tmp"
            rm -f .lyflow-arm64-tmp
          fi
