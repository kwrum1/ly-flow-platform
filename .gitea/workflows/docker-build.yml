name: Offline Release Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-amd64:
    name: Build amd64 offline package
    runs-on: docker
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
      GIT_TERMINAL_PROMPT: "0"
      GOTOOLCHAIN: auto
      LYFLOW_GITEA_TOKEN: ${{ secrets.LYFLOW_GITEA_TOKEN }}
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          if [ ! -f scripts/build-offline-release.sh ]; then
            rm -rf /tmp/lyflow-actions-workspace
            git clone --depth 1 http://127.0.0.1:10000/ly-flow-platform/ly-flow-platform.git /tmp/lyflow-actions-workspace
            cp -a /tmp/lyflow-actions-workspace/. .
          fi

      - name: Check workspace and tools
        run: |
          set -euo pipefail
          test -f scripts/build-offline-release.sh
          command -v go
          command -v node
          command -v npm
          docker version
          docker compose version
          go version
          node --version
          npm --version
          python3 --version

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          npm --prefix frontend ci

      - name: Run targeted tests
        run: |
          set -euo pipefail
          (cd agent && GOWORK=off go test ./cmd)
          (cd server && GOWORK=off go test ./cmd)

      - name: Build amd64 release package
        run: |
          set -euo pipefail
          TARGET_ARCH=amd64 bash scripts/build-offline-release.sh

      - name: Verify amd64 artifact
        run: |
          set -euo pipefail
          package=$(ls -1 release/lyflow-offline-install-amd64-*.tar.gz | tail -n 1)
          tar -tzf "$package" | grep -E '(^|/)ARCH$|docker-compose.yml|images/lyflow-images.tar.gz'
          rm -rf /tmp/lyflow-amd64-artifact
          mkdir -p /tmp/lyflow-amd64-artifact
          tar -xzf "$package" -C /tmp/lyflow-amd64-artifact --strip-components=1
          grep -qx 'amd64' /tmp/lyflow-amd64-artifact/ARCH

      - name: Upload amd64 package to Gitea release
        run: |
          set -euo pipefail
          package=$(ls -1 release/lyflow-offline-install-amd64-*.tar.gz | tail -n 1)
          tag="offline-${GITHUB_SHA:-$(git rev-parse --short HEAD)}"
          api="${GITEA_SERVER_URL:-http://127.0.0.1:10000}/api/v1/repos/ly-flow-platform/ly-flow-platform"
          token="${LYFLOW_GITEA_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "LYFLOW_GITEA_TOKEN or GITHUB_TOKEN is required for release upload" >&2
            exit 1
          fi
          release_json=$(curl -fsS -H "Authorization: token $token" "$api/releases/tags/$tag" || true)
          if [ -z "$release_json" ]; then
            payload=$(TAG="$tag" TARGET="${GITHUB_SHA:-main}" python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["TAG"], "target_commitish": os.environ["TARGET"], "name": "Offline packages " + os.environ["TAG"], "body": "Automated amd64 and arm64 offline release packages.", "draft": False, "prerelease": False}))')
            release_json=$(curl -fsS -X POST -H "Authorization: token $token" -H "Content-Type: application/json" \
              -d "$payload" \
              "$api/releases")
          fi
          release_id=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST -H "Authorization: token $token" -F "attachment=@${package}" "$api/releases/$release_id/assets"

  release-arm64:
    name: Build arm64 offline package
    runs-on: docker
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
      GIT_TERMINAL_PROMPT: "0"
      GOTOOLCHAIN: auto
      LYFLOW_GITEA_TOKEN: ${{ secrets.LYFLOW_GITEA_TOKEN }}
    steps:
      - name: Checkout repository
        run: |
          set -euo pipefail
          if [ ! -f scripts/build-offline-release.sh ]; then
            rm -rf /tmp/lyflow-actions-workspace
            git clone --depth 1 http://127.0.0.1:10000/ly-flow-platform/ly-flow-platform.git /tmp/lyflow-actions-workspace
            cp -a /tmp/lyflow-actions-workspace/. .
          fi

      - name: Enable arm64 binfmt
        run: |
          set -euo pipefail
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx version

      - name: Check workspace and tools
        run: |
          set -euo pipefail
          test -f scripts/build-offline-release.sh
          command -v go
          command -v node
          command -v npm
          docker version
          docker compose version
          go version
          node --version
          npm --version
          python3 --version

      - name: Install frontend dependencies
        run: |
          set -euo pipefail
          npm --prefix frontend ci

      - name: Run targeted tests
        run: |
          set -euo pipefail
          (cd agent && GOWORK=off go test ./cmd)
          (cd server && GOWORK=off go test ./cmd)

      - name: Prepare arm64 agent binary
        run: |
          set -euo pipefail
          if [ -f agent/ly-agent-arm64 ]; then
            echo "Using existing ARM64 agent binary from workspace"
          elif [ -f /root/ly-flow-platform/agent/ly-agent-arm64 ]; then
            echo "Using existing ARM64 agent binary from host release workspace"
            cp /root/ly-flow-platform/agent/ly-agent-arm64 agent/ly-agent-arm64
          else
            docker run --rm --platform linux/arm64 \
              -v "$PWD":/workspace \
              -w /workspace/agent \
              golang:1.25-bookworm \
              bash -lc 'apt-get update && apt-get install -y --no-install-recommends libpcap-dev build-essential ca-certificates && GOWORK=off GOOS=linux GOARCH=arm64 CGO_ENABLED=1 go build -o ly-agent-arm64 ./cmd'
          fi
          file agent/ly-agent-arm64 | grep -E 'ARM aarch64|aarch64'

      - name: Build arm64 release package
        run: |
          set -euo pipefail
          TARGET_ARCH=arm64 ARM64_AGENT_BINARY="$PWD/agent/ly-agent-arm64" bash scripts/build-offline-release.sh

      - name: Verify arm64 artifact
        run: |
          set -euo pipefail
          package=$(ls -1 release/lyflow-offline-install-arm64-*.tar.gz | tail -n 1)
          tar -tzf "$package" | grep -E '(^|/)ARCH$|docker-compose.yml|images/lyflow-images.tar.gz'
          rm -rf /tmp/lyflow-arm64-artifact
          mkdir -p /tmp/lyflow-arm64-artifact
          tar -xzf "$package" -C /tmp/lyflow-arm64-artifact --strip-components=1
          grep -qx 'arm64' /tmp/lyflow-arm64-artifact/ARCH
          grep -q 'latest-arm64' /tmp/lyflow-arm64-artifact/docker-compose.yml

      - name: Upload arm64 package to Gitea release
        run: |
          set -euo pipefail
          package=$(ls -1 release/lyflow-offline-install-arm64-*.tar.gz | tail -n 1)
          tag="offline-${GITHUB_SHA:-$(git rev-parse --short HEAD)}"
          api="${GITEA_SERVER_URL:-http://127.0.0.1:10000}/api/v1/repos/ly-flow-platform/ly-flow-platform"
          token="${LYFLOW_GITEA_TOKEN:-${GITHUB_TOKEN:-}}"
          if [ -z "$token" ]; then
            echo "LYFLOW_GITEA_TOKEN or GITHUB_TOKEN is required for release upload" >&2
            exit 1
          fi
          release_json=$(curl -fsS -H "Authorization: token $token" "$api/releases/tags/$tag" || true)
          if [ -z "$release_json" ]; then
            payload=$(TAG="$tag" TARGET="${GITHUB_SHA:-main}" python3 -c 'import json, os; print(json.dumps({"tag_name": os.environ["TAG"], "target_commitish": os.environ["TARGET"], "name": "Offline packages " + os.environ["TAG"], "body": "Automated amd64 and arm64 offline release packages.", "draft": False, "prerelease": False}))')
            release_json=$(curl -fsS -X POST -H "Authorization: token $token" -H "Content-Type: application/json" \
              -d "$payload" \
              "$api/releases")
          fi
          release_id=$(printf '%s' "$release_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -X POST -H "Authorization: token $token" -F "attachment=@${package}" "$api/releases/$release_id/assets"
