name: Release (Gitea)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-gitea-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "http://10.1.18.100:10000/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Build binaries and frontend
        env:
          GOPROXY: https://goproxy.cn,direct
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p server/dist/linux/amd64 security-engine/dist/linux/amd64 agent/dist/linux/amd64
          (cd server && GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/linux/amd64/ly-server ./cmd)
          (cd server && GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/linux/amd64/ly-agent-center ./agentcenter)
          (cd security-engine && GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/linux/amd64/ly-security-engine ./cmd)
          (cd agent && GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/linux/amd64/ly-agent ./cmd)
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
      - name: Build images
        run: |
          set -euo pipefail
          arch=amd64
          docker build --build-arg TARGETARCH=$arch --build-arg RUNTIME_IMAGE=redis:7-alpine -f deploy/docker/server.Dockerfile -t ly-flow/server:release-$arch .
          docker build --build-arg TARGETARCH=$arch --build-arg RUNTIME_IMAGE=redis:7-alpine -f deploy/docker/security-engine.Dockerfile -t ly-flow/security-engine:release-$arch .
          docker build --build-arg RUNTIME_IMAGE=nginx:1.27-alpine -f frontend/Dockerfile -t ly-flow/frontend:release-$arch .
          docker build --build-arg TARGETARCH=$arch -f deploy/docker/local-mirror.Dockerfile -t ly-flow/local-mirror:release-$arch .
          docker build -f deploy/docker/suricata.Dockerfile -t ly-flow/suricata-profile:release-$arch .
          docker tag postgres:16-alpine ly-flow/vendor/postgres:16-alpine-$arch
          docker tag redis:7-alpine ly-flow/vendor/redis:7-alpine-$arch
          docker tag clickhouse/clickhouse-server:24.8-alpine ly-flow/vendor/clickhouse:24.8-alpine-$arch
      - name: Build installer bundle
        env:
          LYFLOW_TARGET_ARCH: amd64
        run: |
          set -euo pipefail
          bash scripts/build-docker-bundle.sh
          ls -lh release/lyflow-server-amd64.tar.gz
          gzip -t release/lyflow-server-amd64.tar.gz
      - name: Publish to Gitea release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="http://10.1.18.100:10000/api/v1/repos/${GITHUB_REPOSITORY}"
          asset="release/lyflow-server-amd64.tar.gz"
          sha=$(sha256sum "$asset" | cut -d' ' -f1)
          body="一键部署包（amd64）：lyflow-server-amd64.tar.gz。sha256: ${sha}。提交 ${GITHUB_SHA}，内网 Gitea 构建。"
          resp=$(curl -sS -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"LyFlow ${VERSION} (Gitea build)\",\"body\":\"${body}\"}" \
            "${api}/releases")
          id=$(printf '%s' "$resp" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            id=$(curl -sS -H "Authorization: token ${TOKEN}" "${api}/releases/tags/${VERSION}" | jq -r '.id // empty')
          fi
          [ -n "$id" ] || { echo "cannot resolve release id: $resp" >&2; exit 1; }
          curl -sS -X POST -H "Authorization: token ${TOKEN}" \
            -F "attachment=@${asset}" "${api}/releases/${id}/assets?name=lyflow-server-amd64.tar.gz" | jq -r '.name // .message'
          echo "sha256: ${sha}"
