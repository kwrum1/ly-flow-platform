name: Release (Gitea)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-gitea-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "http://10.1.18.100:10000/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF}"
          git checkout -q FETCH_HEAD
      - name: Build binaries and frontend
        env:
          GOPROXY: https://goproxy.cn,direct
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          mkdir -p server/dist/linux/amd64 security-engine/dist/linux/amd64 agent/dist/linux/amd64
          (cd server && GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/linux/amd64/ly-server ./cmd)
          (cd server && GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/linux/amd64/ly-agent-center ./agentcenter)
          (cd security-engine && GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/linux/amd64/ly-security-engine ./cmd)
          (cd agent && GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o dist/linux/amd64/ly-agent ./cmd)
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$version" != "$GITHUB_REF_NAME" ] || version="dev-${GITHUB_SHA:0:8}"
          stage="release/lyflow-${version}-linux-amd64"
          rm -rf "$stage" && mkdir -p "$stage/bin" "$stage/web"
          cp server/dist/linux/amd64/ly-server server/dist/linux/amd64/ly-agent-center "$stage/bin/"
          cp security-engine/dist/linux/amd64/ly-security-engine "$stage/bin/"
          cp agent/dist/linux/amd64/ly-agent "$stage/bin/"
          cp -a frontend/dist/. "$stage/web/"
          cp -a rules "$stage/rules"
          cp docker-compose.yml scripts/init-db.sql "$stage/"
          cat > "$stage/README.md" <<EOF
          # 流影 LyFlow ${version} 构建产物（linux/amd64）

          由内网 Gitea Actions 在 ${GITHUB_SHA} 构建，包含：
          - bin/ly-server, ly-agent-center, ly-security-engine, ly-agent
          - web/ 前端静态文件
          - rules/ 规则源与编译产物
          - docker-compose.yml, init-db.sql

          需要完整 Docker 一键安装包时使用 GitHub 的 latest-server 发布。
          EOF
          tar -C release -czf "release/lyflow-${version}-linux-amd64.tar.gz" "lyflow-${version}-linux-amd64"
          (cd release && sha256sum "lyflow-${version}-linux-amd64.tar.gz" > "lyflow-${version}-linux-amd64.tar.gz.sha256")
          ls -lh release/
      - name: Publish to Gitea release
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="http://10.1.18.100:10000/api/v1/repos/${GITHUB_REPOSITORY}"
          asset="release/lyflow-${VERSION#v}-linux-amd64.tar.gz"
          body="内网 Gitea 自动构建：ly-server / ly-agent-center / ly-security-engine / ly-agent 与前端 dist。提交 ${GITHUB_SHA}。"
          resp=$(curl -sS -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"LyFlow ${VERSION} (Gitea build)\",\"body\":\"${body}\"}" \
            "${api}/releases")
          id=$(printf '%s' "$resp" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            id=$(curl -sS -H "Authorization: token ${TOKEN}" "${api}/releases/tags/${VERSION}" | jq -r '.id // empty')
          fi
          [ -n "$id" ] || { echo "cannot resolve release id: $resp" >&2; exit 1; }
          curl -sS -X POST -H "Authorization: token ${TOKEN}" \
            -F "attachment=@${asset}" "${api}/releases/${id}/assets?name=$(basename "$asset")" | jq -r '.name // .message'
          curl -sS -X POST -H "Authorization: token ${TOKEN}" \
            -F "attachment=@${asset}.sha256" "${api}/releases/${id}/assets?name=$(basename "$asset").sha256" | jq -r '.name // .message'
