name: Release (Gitea)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    # 03:30 Asia/Shanghai (19:30 UTC), after the GitHub build finishes
    - cron: '30 19 * * *'

concurrency:
  group: release-gitea-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Publish exactly the GitHub release artifacts (same bytes, same digests).
      # api.github.com and release downloads work from this host; gh-proxy.com
      # is the fallback when GitHub stalls.
      - name: Mirror GitHub release assets
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION=latest-server
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          api="http://10.1.18.100:10000/api/v1/repos/${GITHUB_REPOSITORY}"
          mkdir -p release
          curl -fsS --max-time 60 -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/kwrum1/ly-flow-platform/releases/tags/latest-server" \
            -o /tmp/gh-release.json
          jq -r '.assets[] | [.name, .browser_download_url, .digest] | @tsv' /tmp/gh-release.json |
          while IFS=$'\t' read -r name url digest; do
            echo "downloading ${name}"
            if ! curl -fsSL --max-time 1800 --retry 3 --retry-delay 5 -o "release/${name}" "${url}"; then
              echo "direct download failed, retrying through gh-proxy.com"
              curl -fsSL --max-time 1800 --retry 3 --retry-delay 5 -o "release/${name}" "https://gh-proxy.com/${url}"
            fi
            want="${digest#sha256:}"
            got=$(sha256sum "release/${name}" | cut -d' ' -f1)
            [ "${want}" = "${got}" ] || { echo "digest mismatch for ${name}: want ${want} got ${got}" >&2; exit 1; }
            gzip -t "release/${name}"
            echo "${name} ok $(stat -c%s "release/${name}") bytes"
          done

          resp=$(curl -sS -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"LyFlow ${VERSION}\",\"body\":\"与 GitHub latest-server 一致的 AMD64/ARM64 一键部署包。\"}" \
            "${api}/releases")
          id=$(printf '%s' "$resp" | jq -r '.id // empty')
          if [ -z "$id" ]; then
            id=$(curl -sS -H "Authorization: token ${TOKEN}" "${api}/releases/tags/${VERSION}" | jq -r '.id // empty')
          fi
          [ -n "$id" ] || { echo "cannot resolve release: $resp" >&2; exit 1; }

          curl -sS -H "Authorization: token ${TOKEN}" "${api}/releases/${id}" |
            jq -r '.assets[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r aid aname; do
            case "${aname}" in
              lyflow-server-amd64.tar.gz|lyflow-server-arm64.tar.gz)
                curl -sS -X DELETE -H "Authorization: token ${TOKEN}" "${api}/releases/${id}/assets/${aid}" >/dev/null
                echo "removed old asset ${aname}" ;;
            esac
          done

          for name in lyflow-server-amd64.tar.gz lyflow-server-arm64.tar.gz; do
            curl -sS -X POST -H "Authorization: token ${TOKEN}" \
              -F "attachment=@release/${name}" "${api}/releases/${id}/assets?name=${name}" | jq -r '.name // .message'
          done
