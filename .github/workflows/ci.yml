name: Platform Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      DEBIAN_FRONTEND: noninteractive
      GIT_TERMINAL_PROMPT: "0"
      GCM_INTERACTIVE: never
      GOTOOLCHAIN: auto
      GOSUMDB: sum.golang.org
      GOPROXY: https://proxy.golang.org,direct
      SURICATA_REPLAY_IMAGE: docker.io/jasonish/suricata:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup current Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Setup current Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Setup current stable Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install frontend dependencies from registry
        working-directory: frontend
        run: npm ci --no-audit --no-fund --prefer-online

      - name: Install current browser and sensor
        run: |
          npm --prefix frontend exec playwright install chromium
          docker pull docker.io/jasonish/suricata:latest
          docker pull redis:7-alpine
          docker pull postgres:16-alpine
          docker pull clickhouse/clickhouse-server:24.8-alpine

      - name: Run real-detection release gate
        run: scripts/qa/run-go-tests.sh real-detection

      - name: Install Python RASP test dependencies
        working-directory: agent/rasp/python
        run: python -m pip install --no-cache-dir -e '.[dev]'

      - name: Run unified verification matrix
        run: scripts/verify-platform.sh
